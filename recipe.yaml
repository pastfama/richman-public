$engine: 3
$onesync: on
name: Richman Enhanced Bootstrap
version: 1.0.0
author: Fameshire
description: Russian-language GTA V Enhanced bootstrap; the private Richman gameplay and Foundry bridge stack is installed separately.

tasks:
  # Use the official Enhanced-compatible Cfx base resources.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: c6afa3909c763e3327ed76825e78453286c99f05
    subpath: resources
    dest: ./tmp

  - action: ensure_dir
    path: ./resources

  - action: move_path
    src: ./tmp/[managers]/mapmanager/
    dest: ./resources/mapmanager/

  - action: move_path
    src: ./tmp/[managers]/spawnmanager/
    dest: ./resources/spawnmanager/

  - action: move_path
    src: ./tmp/[gamemodes]/[maps]/fivem-map-hipster/
    dest: ./resources/fivem-map-hipster/

  - action: move_path
    src: ./tmp/[gamemodes]/[maps]/fivem-map-skater/
    dest: ./resources/fivem-map-skater/

  - action: move_path
    src: ./tmp/[gamemodes]/basic-gamemode/
    dest: ./resources/basic-gamemode/

  - action: remove_path
    path: ./tmp

  # txAdmin substitutes its required placeholders after recipe tasks complete.
  - action: write_file
    file: ./server.cfg
    data: |
      # Richman — Russian-language GTA V Enhanced baseline.
      # Recipe manages the base tree only. Apply the private Richman stack after
      # the database, txAdmin profile, and bridge secrets have been provisioned.
      sv_licenseKey "{{svLicense}}"
      sv_hostname "Richman | Живой Город RP"
      sv_maxclients {{maxClients}}
      {{serverEndpoints}}

      sets sv_projectName "Richman"
      sets sv_projectDesc "Русскоязычный живой город на GTA V Enhanced."
      sets tags "roleplay, russian, rp, enhanced, foundry-agents"

      # NO sv_enforceGameBuild here, deliberately. This recipe targets the Cfx
      # Server runtime ("FiveM for GTAV Enhanced", the fat `cfx-server` binary);
      # Enhanced supports only the latest game build and loads it by default,
      # and a pinned older build is rejected outright. The runtime binary is what
      # makes a server Enhanced — sv_enhancedHostSupport is a documented no-op
      # and no convar converts a Legacy FXServer install. Do not add a pin back.

      # NOTE: the city's language is NOT a convar. It is Config.Locale in
      # resources/[la]/la_npc_ai/config.lua (set to 'ru-RU' on the Richman copy),
      # plus BRIDGE_LOCALE=ru-RU in npc-bridge.env and TOWN_LOCALE=ru-RU in
      # town.env. See docs/locale.md. A `setr` here would do nothing.

      # Server administration. txAdmin supplies the master account principal.
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      {{addPrincipalsMaster}}
      add_ace group.admin la_foundry_agents.admin allow

      ensure mapmanager
      ensure spawnmanager
      ensure basic-gamemode
      ensure fivem-map-hipster
      ensure fivem-map-skater
      # The private deployment overlay switches to the Richman gameplay pack.
      # This public bootstrap intentionally does not claim to install that pack.